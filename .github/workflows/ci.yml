name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # BLOQUANT : les tests doivent passer.
      - run: python -m unittest discover -s tests -t . -v
      # BLOQUANTS (T-10) : style et typage strict. Versions des outils bornées dans pyproject.toml.
      - run: ruff check .
      - run: mypy
