# Copier en config.yaml (non versionné). Les bornes absolues sont dans orionx/core/config.py.
mode: demo            # seul « demo » est accepté dans cette version
autonomy: semi_auto   # signals_only | semi_auto | auto
symbols: [EURUSD, GBPUSD, XAUUSD]
max_data_age_seconds: 3.0
risk:
  risk_per_trade_pct: 0.5
  max_daily_loss_pct: 3.0
  max_weekly_loss_pct: 6.0
  max_drawdown_pct: 10.0
  max_open_positions: 3
  max_total_open_risk_pct: 2.0
  min_rr: 1.5
  max_consecutive_losses: 4
  max_spread_points: 30
  min_margin_level_pct: 300
  max_slippage_points: 10
  approval_ttl_seconds: 5
